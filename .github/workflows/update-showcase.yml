name: Update repo showcase

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours
  workflow_dispatch:          # run manually from the Actions tab
  push:
    paths:
      - generate.mjs
      - showcase.config.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate cards
        run: node generate.mjs
        env:
          GH_USER: RohanKhollamkar
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A showcase README.md
          git diff --staged --quiet || (git commit -m "chore: update repo showcase" && git push)
