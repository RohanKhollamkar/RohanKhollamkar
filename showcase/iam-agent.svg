<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="461" viewBox="0 0 1000 461" role="img" aria-label="IAM-Agent: A sentry between AI agents and MCP servers: verifies who the agent is, what it may do and on whose behalf, then logs each decision for audit, over STDIO or HTTP.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140c11"/><stop offset="1" stop-color="#26121c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#f0a6c4" stop-opacity=".16"/><stop offset="1" stop-color="#f0a6c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .in { animation: rise .8s ease-out both; }
    .dash { animation: dash 1.1s linear infinite; }
    .blink { animation: blink 3s ease-in-out infinite; }
    .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 3s ease-out infinite; }
    .scan { animation: scan 3.2s ease-in-out infinite alternate; }
    .pop { animation: pop 4s ease-in-out infinite; }
    .stage { animation: stage 4s linear infinite; }
    .fill { animation: fill 4s linear infinite; }
    .state { animation: state 4.5s linear infinite; }
    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes ripple { from { transform: scale(1); opacity: .7; } to { transform: scale(2.4); opacity: 0; } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(150px); } }
    @keyframes pop { 0%,100% { opacity: .35; } 25%,60% { opacity: 1; } }
    @keyframes stage { 0%,100% { opacity: .2; } 10%,40% { opacity: 1; } }
    @keyframes fill { 0% { stroke-dashoffset: var(--len); } 75%,100% { stroke-dashoffset: 0; } }
    @keyframes state { 0%,100% { opacity: .35; } 8%,30% { opacity: 1; } }
    @keyframes cursor { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .in,.dash,.blink,.ripple,.scan,.pop,.stage,.fill,.state,.cursor { animation: none; opacity: 1; }
      .fill { stroke-dashoffset: 0; }
    }
  </style>
  <rect width="1000" height="461" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="461" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="999" height="460" rx="20" fill="none" stroke="#f0a6c4" stroke-opacity=".28"/>

  <g class="in">
    <text x="44" y="60" class="mono" font-size="12" letter-spacing="1.5" fill="#f0a6c4">AI &amp; MCP SECURITY · AGENT IDENTITY · 2026</text>
    <text x="44" y="114" class="serif" font-size="44" fill="#f7eef2">IAM-Agent</text>
    <text x="44" y="150" class="sans" font-size="15" fill="#b7a0ab">A sentry between AI agents and MCP servers: verifies</text>
    <text x="44" y="173" class="sans" font-size="15" fill="#b7a0ab">who the agent is, what it may do and on whose behalf,</text>
    <text x="44" y="196" class="sans" font-size="15" fill="#b7a0ab">then logs each decision for audit, over STDIO or HTTP.</text>
    <text x="44" y="231" class="mono" font-size="12" fill="#f7eef2"><tspan fill="#f0a6c4" letter-spacing="1.5">WHY &gt;</tspan> an agent's name is not proof of who it is<tspan class="cursor" fill="#f0a6c4"> ▍</tspan></text>
  </g>
  <g class="in" style="animation-delay:.2s">
    <text x="44" y="256" class="mono" font-size="9.5" letter-spacing=".8" font-weight="400" fill="#b7a0ab">PLAIN MCP</text><text x="162" y="256" class="mono" font-size="9.5" fill="#b7a0ab">→</text><text x="178" y="256" class="mono" font-size="9.5" fill="#b7a0ab">identity and audit are left to each server</text><text x="44" y="272" class="mono" font-size="9.5" letter-spacing=".8" font-weight="700" fill="#f0a6c4">IAM-AGENT</text><text x="162" y="272" class="mono" font-size="9.5" fill="#f0a6c4">→</text><text x="178" y="272" class="mono" font-size="9.5" fill="#f7eef2">every request verified, scoped and logged</text>
    <line x1="44" y1="291" x2="486" y2="291" stroke="#f0a6c4" stroke-opacity=".18"/>
    <text x="44" y="315" class="serif" font-size="17" fill="#f0a6c4">Verified identity</text><text x="44" y="332" class="sans" font-size="10.5" fill="#b7a0ab">a SPIFFE SVID proves</text><text x="44" y="345" class="sans" font-size="10.5" fill="#b7a0ab">which agent is calling,</text><text x="44" y="358" class="sans" font-size="10.5" fill="#b7a0ab">not just a name</text><text x="192" y="315" class="serif" font-size="17" fill="#f0a6c4">Scoped access</text><text x="192" y="332" class="sans" font-size="10.5" fill="#b7a0ab">the permission engine</text><text x="192" y="345" class="sans" font-size="10.5" fill="#b7a0ab">decides which tools each</text><text x="192" y="358" class="sans" font-size="10.5" fill="#b7a0ab">agent may use</text><text x="340" y="315" class="serif" font-size="17" fill="#f0a6c4">Accountability</text><text x="340" y="332" class="sans" font-size="10.5" fill="#b7a0ab">delegation chain and</text><text x="340" y="345" class="sans" font-size="10.5" fill="#b7a0ab">audit log show who acted,</text><text x="340" y="358" class="sans" font-size="10.5" fill="#b7a0ab">and for whom</text>
    <rect x="44" y="375" width="91" height="24" rx="12" fill="#f0a6c4" fill-opacity=".08" stroke="#f0a6c4" stroke-opacity=".4"/><text x="89.5" y="391" class="mono" font-size="11" fill="#f0a6c4" text-anchor="middle">Agentic AI</text><rect x="143" y="375" width="44" height="24" rx="12" fill="#f0a6c4" fill-opacity=".08" stroke="#f0a6c4" stroke-opacity=".4"/><text x="165" y="391" class="mono" font-size="11" fill="#f0a6c4" text-anchor="middle">MCP</text><rect x="195" y="375" width="118" height="24" rx="12" fill="#f0a6c4" fill-opacity=".08" stroke="#f0a6c4" stroke-opacity=".4"/><text x="254" y="391" class="mono" font-size="11" fill="#f0a6c4" text-anchor="middle">Agent identity</text><rect x="321" y="375" width="111" height="24" rx="12" fill="#f0a6c4" fill-opacity=".08" stroke="#f0a6c4" stroke-opacity=".4"/><text x="376.5" y="391" class="mono" font-size="11" fill="#f0a6c4" text-anchor="middle">SPIFFE / SVID</text><rect x="44" y="407" width="131" height="24" rx="12" fill="#f0a6c4" fill-opacity=".08" stroke="#f0a6c4" stroke-opacity=".4"/><text x="109.5" y="423" class="mono" font-size="11" fill="#f0a6c4" text-anchor="middle">Delegation chain</text><rect x="183" y="407" width="98" height="24" rx="12" fill="#f0a6c4" fill-opacity=".08" stroke="#f0a6c4" stroke-opacity=".4"/><text x="232" y="423" class="mono" font-size="11" fill="#f0a6c4" text-anchor="middle">Audit trail</text>
  </g>

