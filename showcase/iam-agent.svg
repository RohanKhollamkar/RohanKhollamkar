<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="IAM Agent: Nobody knows who an AI agent is, what it's allowed to do, or who's responsible when it does something wrong. This is arguably the single most urgent unsolved infrastructure problem in AI right now. When Agent A invokes Agent B, which calls a tool, which triggers a payment — every hop must be cryptographically provable back to an accountable human.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140c11"/><stop offset="1" stop-color="#26121c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.5">
