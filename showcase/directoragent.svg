<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Directoragent: An AI agent that takes a single photo and a scene description to produce a production-quality storyboard — a sequenced set of cinematic video clips with consistent characters, controlled camera grammar, and validated quality. Built on Higgsfield's MCP for generation (30+ models including Soul, Kling 3.0, Veo 3.1, Wan 2.6) with multi-phase planner.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140c11"/><stop offset="1" stop-color="#26121c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#f0a6c4" stop-opacity=".16"/><stop offset="1" stop-color="#f0a6c4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; }
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .in { animation: rise .8s ease-out both; }
    .dash { animation: dash 1.1s linear infinite; }
    .blink { animation: blink 3s ease-in-out infinite; }
    .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 3s ease-out infinite; }
    .scan { animation: scan 3.2s ease-in-out infinite alternate; }
    .pop { animation: pop 4s ease-in-out infinite; }
    .stage { animation: stage 4s linear infinite; }
    .fill { animation: fill 4s linear infinite; }
    .state { animation: state 4.5s linear infinite; }
    .cursor { animation: cursor 1s steps(1) infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes dash { to { stroke-dashoffset: -22; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes ripple { from { transform: scale(1); opacity: .7; } to { transform: scale(2.4); opacity: 0; } }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(150px); } }
    @keyframes pop { 0%,100% { opacity: .35; } 25%,60% { opacity: 1; } }
    @keyframes stage { 0%,100% { opacity: .2; } 10%,40% { opacity: 1; } }
    @keyframes fill { 0% { stroke-dashoffset: var(--len); } 75%,100% { stroke-dashoffset: 0; } }
    @keyframes state { 0%,100% { opacity: .35; } 8%,30% { opacity: 1; } }
    @keyframes cursor { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .in,.dash,.blink,.ripple,.scan,.pop,.stage,.fill,.state,.cursor { animation: none; opacity: 1; }
      .fill { stroke-dashoffset: 0; }
    }
  </style>
  <rect width="1000" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="360" rx="20" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="999" height="359" rx="20" fill="none" stroke="#f0a6c4" stroke-opacity=".28"/>

  <g class="in">
    <text x="44" y="60" class="mono" font-size="12" letter-spacing="2.5" fill="#f0a6c4">01 · HIGGSFIELD-AI · MCP · 2026</text>
    <text x="44" y="114" class="serif" font-size="44" fill="#f7eef2">Directoragent</text>
    <text x="44" y="150" class="sans" font-size="15" fill="#b7a0ab">An AI agent that takes a single photo and a scene description</text>
    <text x="44" y="173" class="sans" font-size="15" fill="#b7a0ab">to produce a production-quality storyboard — a sequenced set…</text>
    <text x="44" y="208" class="mono" font-size="12" fill="#f7eef2"><tspan fill="#f0a6c4" letter-spacing="1.5">BUILT &gt;</tspan> python + shell · since jun 2026<tspan class="cursor" fill="#f0a6c4"> ▍</tspan></text>
  </g>
