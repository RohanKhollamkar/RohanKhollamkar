    <linearGradient id="archfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0.62" stop-color="#14070d" stop-opacity="0"/><stop offset="1" stop-color="#14070d" stop-opacity="0.9"/></linearGradient>
