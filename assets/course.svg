      <circle r="2.6" fill="#fff"><animateMotion dur="2.2s" begin="0s" repeatCount="indefinite" path="M14 0 H34 L58 -13"/></circle><circle r="2.6" fill="#fff"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M14 0 H34 L58 13"/></circle></g>
