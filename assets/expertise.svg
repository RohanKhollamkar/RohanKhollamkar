<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-label="Expertise">
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#6e1b3d" stop-opacity="0.9"/><stop offset="0.55" stop-color="#3a0f24" stop-opacity="0.45"/><stop offset="1" stop-color="#14070d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a6c4" stop-opacity="0"/><stop offset="0.5" stop-color="#f0a6c4"/><stop offset="1" stop-color="#f0a6c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0a6c4" stop-opacity="0.9"/><stop offset="1" stop-color="#f0a6c4" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#f0a6c4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="380" rx="18"/></clipPath><linearGradient id="scanc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f0a6c4" stop-opacity="0"/><stop offset="1" stop-color="#f0a6c4" stop-opacity=".14"/></linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; } .serif { font-family: Georgia, 'Times New Roman', 'Liberation Serif', serif; } .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .card { animation: rise .9s ease-out both; }
    .run { animation: run 6s linear infinite; }
    .blink { animation: blink 2.4s ease-in-out infinite; }
    .cursor { animation: cur 1s steps(1) infinite; }
    .type { animation: type 1s steps(26, end) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes run { from { stroke-dashoffset: 100; } to { stroke-dashoffset: -100; } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @keyframes cur { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
    @keyframes ring { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2); opacity: 0; } }
    @keyframes scan { from { transform: translateX(-80px); } to { transform: translateX(460px); } }
    @keyframes bars { 0%,100% { transform: scaleY(.45); } 50% { transform: scaleY(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    .lab { font-size: 11px; letter-spacing: .24em; fill: #d68aae; }
    .tile { fill: #1d0a13; stroke: #4a1c30; }
    .tl { font-size: 10px; letter-spacing: .2em; fill: #d68aae; }
    .big { font-size: 46px; fill: none; stroke: #f0a6c4; stroke-opacity: .75; stroke-width: 1; }
    .lt { font-size: 21px; fill: #f7eef2; }
    .ct { font-size: 15px; fill: #f7eef2; }
    .pill { fill: #2a1019; stroke: #6b2a44; } .pt { font-size: 12px; fill: #e9b8cd; }
    .bar { transform-box: fill-box; transform-origin: bottom; animation: bars 2.6s ease-in-out infinite; }
    .scanr { animation: scan 6s linear infinite; }
  </style>
  <g class="card" clip-path="url(#clip)">
    <rect width="1000" height="380" rx="18" fill="#14070d"/>
    <rect width="1000" height="380" fill="url(#glow)"/>
    <rect x="500" width="500" height="380" fill="url(#grid)"/>
    <rect x="0.5" y="0.5" width="999" height="379" rx="18" fill="none" stroke="#5a2339"/>
    <rect x="1" y="1" width="998" height="378" rx="18" fill="none" stroke="url(#edge)" stroke-width="2" pathLength="100" stroke-dasharray="22 78" class="run"/>
    
    <text x="48" y="52" class="mono lab">LEADERSHIP</text>
    <text x="520" y="52" class="mono lab">AI CRAFT</text>
    <text x="48" y="304" class="mono lab">INDUSTRIES</text>
