      <text x="136" y="108" class="mono tl">STRATEGY</text>
      <text x="136" y="136" class="serif lt">Product &amp; AI Strategy</text>
      <rect x="430" y="100" width="5" height="32" rx="2.5" fill="#f0a6c4" opacity=".55" class="bar" style="animation-delay:0.00s"/><rect x="439" y="100" width="5" height="32" rx="2.5" fill="#f0a6c4" opacity=".55" class="bar" style="animation-delay:0.25s"/><rect x="448" y="100" width="5" height="32" rx="2.5" fill="#f0a6c4" opacity=".55" class="bar" style="animation-delay:0.50s"/><rect x="457" y="100" width="5" height="32" rx="2.5" fill="#f0a6c4" opacity=".55" class="bar" style="animation-delay:0.75s"/></g><g><rect x="48" y="174" width="422" height="92" rx="14" class="tile"/>
      <text x="68" y="236" class="serif big">02</text>
      <text x="136" y="212" class="mono tl">LEADERSHIP</text>
      <text x="136" y="240" class="serif lt">Revenue &amp; Team Leadership</text>
      <rect x="430" y="204" width="5" height="32" rx="2.5" fill="#f0a6c4" opacity=".55" class="bar" style="animation-delay:0.40s"/><rect x="439" y="204" width="5" height="32" rx="2.5" fill="#f0a6c4" opacity=".55" class="bar" style="animation-delay:0.65s"/><rect x="448" y="204" width="5" height="32" rx="2.5" fill="#f0a6c4" opacity=".55" class="bar" style="animation-delay:0.90s"/><rect x="457" y="204" width="5" height="32" rx="2.5" fill="#f0a6c4" opacity=".55" class="bar" style="animation-delay:1.15s"/></g><rect x="48" y="318" width="80" height="30" rx="15" class="pill"/><text x="88" y="337" text-anchor="middle" class="mono pt">Fintech</text><rect x="136" y="318" width="95" height="30" rx="15" class="pill"/><text x="183.5" y="337" text-anchor="middle" class="mono pt">Insurtech</text><rect x="239" y="318" width="102" height="30" rx="15" class="pill"/><text x="290" y="337" text-anchor="middle" class="mono pt">E-commerce</text><rect x="349" y="318" width="80" height="30" rx="15" class="pill"/><text x="389" y="337" text-anchor="middle" class="mono pt">MarTech</text><g><rect x="520" y="70" width="212" height="84" rx="12" class="tile"/>
      <text x="536" y="94" class="mono tl">01</text>
      <circle cx="714" cy="90" r="3.5" fill="#f0a6c4" class="blink" style="animation-delay:0.00s"/>
      <text x="536" y="120" class="sans ct">AI Architecture &amp;</text><text x="536" y="139" class="sans ct">System Design</text></g><g><rect x="744" y="70" width="212" height="84" rx="12" class="tile"/>
      <text x="760" y="94" class="mono tl">02</text>
      <circle cx="938" cy="90" r="3.5" fill="#f0a6c4" class="blink" style="animation-delay:0.45s"/>
      <text x="760" y="120" class="sans ct">AI Quality &amp; Safety</text><text x="760" y="139" class="sans ct">Evaluation</text></g><g><rect x="520" y="166" width="212" height="84" rx="12" class="tile"/>
      <text x="536" y="190" class="mono tl">03</text>
      <circle cx="714" cy="186" r="3.5" fill="#f0a6c4" class="blink" style="animation-delay:0.90s"/>
      <text x="536" y="216" class="sans ct">Prompt Engineering</text></g><g><rect x="744" y="166" width="212" height="84" rx="12" class="tile"/>
      <text x="760" y="190" class="mono tl">04</text>
      <circle cx="938" cy="186" r="3.5" fill="#f0a6c4" class="blink" style="animation-delay:1.35s"/>
      <text x="760" y="216" class="sans ct">Multi-Agent Systems</text></g><g><rect x="520" y="262" width="212" height="84" rx="12" class="tile"/>
      <text x="536" y="286" class="mono tl">05</text>
      <circle cx="714" cy="282" r="3.5" fill="#f0a6c4" class="blink" style="animation-delay:1.80s"/>
      <text x="536" y="312" class="sans ct">MCP Servers</text></g><g><rect x="744" y="262" width="212" height="84" rx="12" class="tile"/>
      <text x="760" y="286" class="mono tl">06</text>
      <circle cx="938" cy="282" r="3.5" fill="#f0a6c4" class="blink" style="animation-delay:2.25s"/>
      <text x="760" y="312" class="sans ct">RAG</text></g>
    <clipPath id="grid-clip"><rect x="520" y="70" width="436" height="276"/></clipPath>
    <g clip-path="url(#grid-clip)"><rect x="520" y="70" width="80" height="276" fill="url(#scanc)" class="scanr"/></g>
  </g>
</svg>
